# Beyond Notes with Postgres: for several users or if you already back up
# Postgres. Set POSTGRES_PASSWORD (and BASE_URL) in the stack's environment or
# a .env file next to this one before the first start.
services:
  app:
    image: ghcr.io/mansoor/beyond-notes:latest
    restart: unless-stopped
    ports:
      - "3800:3800"
    environment:
      BASE_URL: ${BASE_URL:-http://127.0.0.1:3800}
      DATABASE_URL: postgres://beyond:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/beyond_notes
    volumes:
      # uploads, backups and the secrets key live here even with Postgres
      - beyond-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: beyond
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: beyond_notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyond -d beyond_notes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beyond-data:
  pgdata:
