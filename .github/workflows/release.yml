name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Build each architecture on a runner that runs it natively — no QEMU, so the
  # better-sqlite3 compile that used to wedge under emulation just... compiles.
  # Two variants: the lean default image, and "-ml" which adds the optional
  # semantic-layer runtime (transformers.js + onnxruntime, glibc). Each leg
  # pushes an untagged, digest-only image; the merge job stitches per-variant
  # digests into one multi-arch tag each.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, arch: amd64, variant: default, dockerfile: docker/Dockerfile }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64, variant: default, dockerfile: docker/Dockerfile }
          - { platform: linux/amd64, runner: ubuntu-latest, arch: amd64, variant: ml, dockerfile: docker/Dockerfile.ml }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64, variant: ml, dockerfile: docker/Dockerfile.ml }
    runs-on: ${{ matrix.runner }}
    # native builds are minutes, not hours — fail fast if one wedges
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # a cache per (variant, arch) — their layers differ, so a shared ref
          # would clobber. mode=max keeps the intermediate compile stages.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine per-arch digests into one multi-arch manifest per variant, and tag.
  # Default -> :<tag> and :latest. ml -> :<tag>-ml and :latest-ml.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download default digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/d-default
          pattern: digest-default-*
          merge-multiple: true
      - name: Download ml digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/d-ml
          pattern: digest-ml-*
          merge-multiple: true
      - name: Create and push default tags
        working-directory: /tmp/d-default
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:latest \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Create and push ml tags
        working-directory: /tmp/d-ml
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ github.ref_name }}-ml \
            -t ${{ env.IMAGE }}:latest-ml \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_name }}
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_name }}-ml

  release:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Draft GitHub release with changelog
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
