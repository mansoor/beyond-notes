name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # a hung QEMU build must fail fast, not burn six hours (v0.1.1 hung twice)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          # pinned: binfmt:latest picked up a QEMU version that hangs node-gyp
          # compiles under arm64 emulation (pnpm install never returns)
          image: tonistiigi/binfmt:qemu-v8.1.5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          # Reuse layers across releases so the slow arm64 native-module compile
          # (better-sqlite3 under emulation) only reruns when deps change.
          # Registry cache, not type=gha: tag builds each run on their own ref
          # and do NOT share the Actions cache scope, so a GHCR cache image —
          # readable by every run — is the only cache that actually hits.
          # mode=max keeps the intermediate build stages, which is where the
          # compile lives; without it only the final layer is cached.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
      - name: Draft GitHub release with changelog
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
