name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # a step, not a service: service containers cannot override the command,
      # and minio/minio needs `server /data`; the test creates its own bucket
      - name: Start MinIO
        run: docker run -d --name minio -p 9000:9000 minio/minio server /data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (SQLite + Postgres + MinIO)
        run: pnpm test
        env:
          TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/bn_test
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_BUCKET: bn-test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
