name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # An S3-compatible server for the blob-store tests. MinIO no longer
      # publishes free images, so this is Adobe's S3Mock (credentials are
      # accepted, not checked). The test creates its own bucket.
      - name: Start S3Mock
        run: |
          docker run -d --name s3mock -p 9090:9090 adobe/s3mock:latest
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9090/ >/dev/null && break; sleep 1; done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (SQLite + Postgres + S3)
        run: pnpm test
        env:
          TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/bn_test
          TEST_S3_ENDPOINT: http://127.0.0.1:9090
          TEST_S3_BUCKET: bn-test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
